<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144">
  <defs>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080e12" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="infernalArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1414"/>
      <stop offset="50%" stop-color="#240707"/>
      <stop offset="100%" stop-color="#0f0000"/>
    </linearGradient>
    <radialGradient id="hellfireAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="20%" stop-color="#ffde59"/>
      <stop offset="50%" stop-color="#ff4d1a"/>
      <stop offset="85%" stop-color="#940505"/>
      <stop offset="100%" stop-color="#4a0000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Infernal Wings / Fire Plumes Behind -->
  <path d="M64 48 C20 10 0 40 4 78 C20 62 40 70 52 74 Z" fill="#ff3b00" opacity="0.85"/>
  <path d="M64 48 C108 10 128 40 124 78 C108 62 88 70 76 74 Z" fill="#ff3b00" opacity="0.85"/>
  <path d="M64 42 C30 16 14 36 22 62 C34 50 48 58 56 62 Z" fill="#ffcc00" opacity="0.9"/>
  <path d="M64 42 C98 16 114 36 106 62 C94 50 80 58 72 62 Z" fill="#ffcc00" opacity="0.9"/>

  <ellipse cx="64" cy="136" rx="48" ry="8" fill="url(#shadowGlow)"/>

  <!-- Molten Armor Legs -->
  <path d="M34 88 L22 130 L46 132 L56 90 Z" fill="url(#infernalArmor)" stroke="#ff2600" stroke-width="2.5"/>
  <path d="M72 90 L82 132 L106 130 L94 88 Z" fill="url(#infernalArmor)" stroke="#ff2600" stroke-width="2.5"/>

  <!-- Molten Torso -->
  <path d="M32 30 L22 66 L106 66 L96 30 Z" fill="url(#infernalArmor)" stroke="#ff2600" stroke-width="3"/>

  <!-- Raging Hellfire Furnace Heart -->
  <circle cx="64" cy="54" r="28" fill="url(#hellfireAura)"/>
  <circle cx="64" cy="54" r="10" fill="#ffffff"/>

  <!-- Helm Ablaze with Horns of Fire -->
  <path d="M42 12 L86 12 L92 34 L36 34 Z" fill="url(#infernalArmor)" stroke="#ff2600" stroke-width="3"/>
  <path d="M42 12 L34 -6 L50 6 L64 -4 L78 6 L94 -6 L86 12 Z" fill="#ffcc00" stroke="#ff2600" stroke-width="2.5"/>
  <!-- Burning Crimson Eyes -->
  <polygon points="44,22 60,22 58,28 46,28" fill="#ffffff"/>
  <polygon points="68,22 84,22 82,28 70,28" fill="#ffffff"/>

  <!-- Incandescent Hellfire Cleaver -->
  <path d="M116 18 L108 116" stroke="#ffcc00" stroke-width="6" stroke-linecap="round"/>
  <path d="M116 18 L134 32 L128 96 L108 86 Z" fill="#ff2600" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M115 26 L128 34 L124 88 L112 80 Z" fill="#ffffff"/>
