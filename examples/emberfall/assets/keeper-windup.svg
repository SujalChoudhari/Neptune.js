<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 144">
  <defs>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080e12" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#080e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="keeperArmor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#735445"/>
      <stop offset="40%" stop-color="#553a2f"/>
      <stop offset="100%" stop-color="#241711"/>
    </linearGradient>
    <radialGradient id="sunburstWarning" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="25%" stop-color="#fff27a"/>
      <stop offset="60%" stop-color="#ff9d14"/>
      <stop offset="100%" stop-color="#ff5500" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bladeOverdrive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#ffe675"/>
      <stop offset="70%" stop-color="#ff9924"/>
      <stop offset="100%" stop-color="#692800"/>
    </linearGradient>
  </defs>

  <!-- Warning Sunburst Telegraph -->
  <circle cx="64" cy="30" r="45" fill="url(#sunburstWarning)"/>
  <ellipse cx="64" cy="136" rx="48" ry="8" fill="url(#shadowGlow)"/>

  <!-- Legs Braced -->
  <path d="M30 88 L16 130 L40 132 L52 90 Z" fill="url(#keeperArmor)" stroke="#1a0f0b" stroke-width="3"/>
  <path d="M76 90 L88 132 L112 130 L98 88 Z" fill="url(#keeperArmor)" stroke="#1a0f0b" stroke-width="3"/>

  <!-- Torso & Mantle Raised -->
  <path d="M32 30 L20 66 L108 66 L96 30 Z" fill="url(#keeperArmor)" stroke="#1a0f0b" stroke-width="3.5"/>

  <!-- Blazing Core (Erupting Sunlight) -->
  <circle cx="64" cy="54" r="22" fill="url(#sunburstWarning)"/>
  <circle cx="64" cy="54" r="8" fill="#ffffff"/>

  <!-- Helm & Crown -->
  <path d="M42 12 L86 12 L92 34 L36 34 Z" fill="url(#keeperArmor)" stroke="#1a0f0b" stroke-width="3.5"/>
  <path d="M42 12 L38 0 L50 8 L64 2 L78 8 L90 0 L86 12 Z" fill="#ffd469" stroke="#1a0f0b" stroke-width="2"/>
  <!-- Blinding Eyes -->
  <polygon points="44,22 60,22 58,28 46,28" fill="#ffffff"/>
  <polygon points="68,22 84,22 82,28 70,28" fill="#ffffff"/>

  <!-- Giant Cleaver Raised High Overhead with Two Hands -->
  <path d="M62 4 L66 60" stroke="#ffd978" stroke-width="7" stroke-linecap="round"/>
  <!-- Colossal Flaming Blade Head -->
  <path d="M50 0 L78 0 L86 46 L42 46 Z" fill="url(#bladeOverdrive)" stroke="#732b00" stroke-width="3"/>

  <!-- Rays of Golden Destruction -->
  <path d="M20 20 L40 28 M108 20 L88 28 M16 48 L36 46 M112 48 L92 46" stroke="#fff194" stroke-width="3.5" stroke-linecap="round"/>
</svg>
