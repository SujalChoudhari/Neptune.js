<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112">
  <defs>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080e12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a5a52"/>
      <stop offset="50%" stop-color="#1b3c36"/>
      <stop offset="100%" stop-color="#0f2622"/>
    </linearGradient>
    <linearGradient id="tunicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#648f82"/>
      <stop offset="70%" stop-color="#3d635a"/>
      <stop offset="100%" stop-color="#28443e"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c6a47"/>
      <stop offset="100%" stop-color="#4d3520"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#dfaa35"/>
      <stop offset="100%" stop-color="#b07d18"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffb834" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="48" cy="104" rx="30" ry="7" fill="url(#shadowGlow)"/>

  <!-- Cloak Back/Hem -->
  <path d="M22 52 L12 90 Q24 99 48 97 Q72 99 84 90 L74 52 Z" fill="url(#cloakGrad)" stroke="#0a1916" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M14 88 Q24 96 48 94 Q72 96 82 88 L83 91 Q72 100 48 98 Q24 100 13 91 Z" fill="url(#goldTrim)"/>

  <!-- Boots / Legs -->
  <path d="M30 76 L24 98 L36 100 L41 78 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="2"/>
  <path d="M55 78 L60 100 L72 98 L66 76 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="2"/>
  <path d="M23 96 L37 96 L37 101 L22 101 Z" fill="#2d1c10"/>
  <path d="M59 96 L73 96 L74 101 L59 101 Z" fill="#2d1c10"/>

  <!-- Tunic / Body -->
  <path d="M31 34 Q48 30 65 34 L71 66 Q48 76 25 66 Z" fill="url(#tunicGrad)" stroke="#0e1f1c" stroke-width="2.5"/>

  <!-- Belt & Buckle -->
  <path d="M26 62 Q48 69 70 62 L71 67 Q48 74 25 67 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="1.5"/>
  <rect x="44" y="62.5" width="8" height="6.5" rx="1.5" fill="url(#goldTrim)" stroke="#4d3520" stroke-width="1"/>

  <!-- Lantern on Left Hip -->
  <ellipse cx="23" cy="68" rx="14" ry="14" fill="url(#lanternGlow)"/>
  <rect x="20.5" y="64" width="5" height="8" rx="1" fill="#fffbe8" stroke="#7a4f15" stroke-width="1"/>
  <path d="M19 63 L27 63 L25 60 L21 60 Z" fill="url(#goldTrim)"/>
  <path d="M19 72 L27 72 L25 74 L21 74 Z" fill="url(#goldTrim)"/>

  <!-- Sword Scabbard on Right Back -->
  <path d="M68 36 L86 78 L81 80 L64 38 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="1.5"/>
  <path d="M63 36 L58 24 L62 22 L67 34 Z" fill="url(#goldTrim)" stroke="#3e2a0b" stroke-width="1"/>
  <rect x="55" y="32" width="14" height="3" rx="1" fill="url(#goldTrim)" transform="rotate(-25 62 33)"/>
  <circle cx="58" cy="23" r="2.5" fill="url(#goldTrim)"/>

  <!-- Hood and Face -->
  <path d="M28 20 C28 5 68 5 68 20 C71 35 68 47 48 48 C28 47 25 35 28 20 Z" fill="url(#cloakGrad)" stroke="#0a1916" stroke-width="2.5"/>
  <path d="M33 21 C33 13 63 13 63 21 C64 33 60 41 48 42 C36 41 32 33 33 21 Z" fill="#0d1f1c"/>
  <path d="M37 25 Q48 23 59 25 C60 34 56 39 48 40 C40 39 36 34 37 25 Z" fill="#e6c29a"/>
  <!-- Glowing Determined Eyes -->
  <ellipse cx="43" cy="29" rx="2.5" ry="1.5" fill="#1b2420"/>
  <circle cx="43.5" cy="28.7" r="0.8" fill="#75ffd4"/>
  <ellipse cx="53" cy="29" rx="2.5" ry="1.5" fill="#1b2420"/>
  <circle cx="53.5" cy="28.7" r="0.8" fill="#75ffd4"/>

  <!-- Scarf / Cowl Fold -->
  <path d="M30 38 Q48 45 66 38 Q58 50 48 50 Q38 50 30 38 Z" fill="url(#cloakGrad)" stroke="#0a1916" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="2.5" fill="url(#goldTrim)"/>

  <!-- Arms / Bracers -->
  <path d="M25 40 L16 56 L24 60 L31 46 Z" fill="url(#tunicGrad)" stroke="#0a1916" stroke-width="1.5"/>
  <path d="M16 54 L19 62 L26 59 L23 51 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="1"/>
  <path d="M71 40 L80 56 L72 60 L65 46 Z" fill="url(#tunicGrad)" stroke="#0a1916" stroke-width="1.5"/>
  <path d="M72 51 L69 59 L76 62 L79 54 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="1"/>
</svg>
