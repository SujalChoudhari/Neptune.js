  <ellipse cx="64" cy="48" rx="3" ry="1.5" fill="#75ffd4"/>

  <!-- Tucked limbs -->
  <path d="M36 78 L26 92 L38 96 L46 84 Z" fill="#6d5135" stroke="#1a1109" stroke-width="1.8"/>
  <path d="M52 76 L62 94 L74 92 L62 76 Z" fill="#6d5135" stroke="#1a1109" stroke-width="1.8"/>

  <!-- Wind streaks -->
  <path d="M4 48 Q24 45 38 52" fill="none" stroke="#a7ffe4" stroke-width="2" stroke-linecap="round"/>
  <path d="M6 68 Q28 66 42 70" fill="none" stroke="#a7ffe4" stroke-width="1.5" stroke-linecap="round"/>
</svg>
