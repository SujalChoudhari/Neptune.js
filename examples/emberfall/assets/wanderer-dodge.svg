<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112">
  <defs>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080e12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#347268"/>
      <stop offset="100%" stop-color="#143630"/>
    </linearGradient>
    <linearGradient id="ghostGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70ffd0" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#70ffd0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Ground Shadow Stretched -->
  <ellipse cx="50" cy="102" rx="38" ry="6" fill="url(#shadowGlow)"/>

  <!-- Evasion Ghost Trail Lines -->
  <path d="M12 40 L28 44 M8 55 L32 58 M15 72 L38 74 M22 88 L45 88" stroke="url(#ghostGrad)" stroke-width="3" stroke-linecap="round"/>

  <!-- Low Tumble Body Profile -->
