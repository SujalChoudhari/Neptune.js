<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 112">
  <defs>
    <radialGradient id="shadowGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#080e12" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080e12" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cloakGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a5a52"/>
      <stop offset="50%" stop-color="#1b3c36"/>
      <stop offset="100%" stop-color="#0f2622"/>
    </linearGradient>
    <linearGradient id="tunicGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#648f82"/>
      <stop offset="70%" stop-color="#3d635a"/>
      <stop offset="100%" stop-color="#28443e"/>
    </linearGradient>
    <linearGradient id="leatherGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8c6a47"/>
      <stop offset="100%" stop-color="#4d3520"/>
    </linearGradient>
    <linearGradient id="goldTrim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd56b"/>
      <stop offset="50%" stop-color="#dfaa35"/>
      <stop offset="100%" stop-color="#b07d18"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8db" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffb834" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ff7b00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Ground Shadow Dynamic -->
  <ellipse cx="48" cy="104" rx="32" ry="7" fill="url(#shadowGlow)"/>

  <!-- Cloak Swish Behind -->
  <path d="M22 52 L8 88 Q22 101 44 96 Q70 102 88 88 L74 52 Z" fill="url(#cloakGrad)" stroke="#0a1916" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M9 86 Q22 99 44 94 Q70 100 86 86 L88 89 Q70 103 44 97 Q22 102 8 89 Z" fill="url(#goldTrim)"/>

  <!-- Left Leg (Pushed back) -->
  <path d="M28 74 L16 94 L26 98 L36 78 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="2"/>
  <path d="M15 92 L28 95 L27 100 L14 98 Z" fill="#2d1c10"/>

  <!-- Right Leg (Stepping forward) -->
  <path d="M54 74 L64 97 L76 95 L64 72 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="2"/>
  <path d="M63 94 L77 92 L78 97 L64 99 Z" fill="#2d1c10"/>

  <!-- Tunic / Body -->
  <path d="M30 35 Q48 31 66 35 L70 67 Q48 76 26 67 Z" fill="url(#tunicGrad)" stroke="#0e1f1c" stroke-width="2.5"/>

  <!-- Belt & Buckle -->
  <path d="M27 63 Q48 70 69 63 L70 68 Q48 75 26 68 Z" fill="url(#leatherGrad)" stroke="#1a1109" stroke-width="1.5"/>
  <rect x="44" y="63" width="8" height="6.5" rx="1.5" fill="url(#goldTrim)" stroke="#4d3520" stroke-width="1"/>

  <!-- Lantern on Left Hip (Swinging) -->
  <ellipse cx="20" cy="70" rx="14" ry="14" fill="url(#lanternGlow)"/>
  <rect x="17.5" y="66" width="5" height="8" rx="1" fill="#fffbe8" stroke="#7a4f15" stroke-width="1"/>
  <path d="M16 65 L24 65 L22 62 L18 62 Z" fill="url(#goldTrim)"/>
  <path d="M16 74 L24 74 L22 76 L18 76 Z" fill="url(#goldTrim)"/>

  <!-- Hood and Face -->
  <path d="M28 20 C28 5 68 5 68 20 C71 35 68 47 48 48 C28 47 25 35 28 20 Z" fill="url(#cloakGrad)" stroke="#0a1916" stroke-width="2.5"/>
  <path d="M33 21 C33 13 63 13 63 21 C64 33 60 41 48 42 C36 41 32 33 33 21 Z" fill="#0d1f1c"/>
  <path d="M37 25 Q48 23 59 25 C60 34 56 39 48 40 C40 39 36 34 37 25 Z" fill="#e6c29a"/>
  <ellipse cx="43" cy="29" rx="2.5" ry="1.5" fill="#1b2420"/>
  <circle cx="43.5" cy="28.7" r="0.8" fill="#75ffd4"/>
  <ellipse cx="53" cy="29" rx="2.5" ry="1.5" fill="#1b2420"/>
  <circle cx="53.5" cy="28.7" r="0.8" fill="#75ffd4"/>

  <!-- Scarf / Cowl Fold -->
  <path d="M30 38 Q48 45 66 38 Q58 50 48 50 Q38 50 30 38 Z" fill="url(#cloakGrad)" stroke="#0a1916" stroke-width="1.5"/>
  <circle cx="48" cy="44" r="2.5" fill="url(#goldTrim)"/>

  <!-- Arms (Dynamic stride) -->
  <path d="M26 40 L14 54 L21 59 L30 46 Z" fill="url(#tunicGrad)" stroke="#0a1916" stroke-width="1.5"/>
  <path d="M70 40 L82 58 L74 61 L65 47 Z" fill="url(#tunicGrad)" stroke="#0a1916" stroke-width="1.5"/>
</svg>
