name: Test Suite

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Run root engine tests
        run: npm test

      - name: Generate root documentation
        run: npm run docs

      - name: Run documentation contract tests
        run: npm run test:docs-contract

      - name: Install Triton dependencies
        working-directory: triton
        run: yarn install --frozen-lockfile --non-interactive

      - name: Build Triton editor
        working-directory: triton
        run: npm run build

      - name: Lint Triton editor
        working-directory: triton
        run: npm run lint
