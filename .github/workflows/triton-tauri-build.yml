name: Triton Tauri Build

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/triton-tauri-build.yml'
      - 'triton/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/triton-tauri-build.yml'
      - 'triton/**'

permissions:
  contents: read

jobs:
  linux-deb:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget \
            librsvg2-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: triton/src-tauri -> target

      - name: Install locked Triton dependencies
        working-directory: triton
        run: yarn install --frozen-lockfile

      - name: Build the Linux Debian bundle
        working-directory: triton
        run: yarn tauri build --bundles deb
