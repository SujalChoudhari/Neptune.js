<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
    <title>Triton Editor</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="stylesheet" href="styles/panels.css">
</head>

<body>
    <div id="app" class="triton-app">
        <!-- Top Menu Bar -->
        <header id="toolbar" class="toolbar">
            <div class="toolbar-left">
                <span class="app-title">Triton Editor</span>
                <span id="project-name" class="project-name">No Project</span>
            </div>
            <div class="toolbar-center">
                <div class="tool-buttons">
                    <button id="tool-select" class="tool-btn active" title="Select (V)">⬚</button>
                    <button id="tool-move" class="tool-btn" title="Move (M)">✥</button>
                    <button id="tool-brush" class="tool-btn" title="Tile Brush (B)">🖌</button>
                    <button id="tool-eraser" class="tool-btn" title="Eraser (E)">⌫</button>
                </div>
            </div>
            <div class="toolbar-right">
                <button id="btn-play" class="action-btn" title="Play (F5)">▶ Play</button>
                <button id="btn-test" class="action-btn" title="Run Tests (F6)">🧪 Test</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <div id="main-content" class="main-content">
            <!-- Left Panel: Hierarchy & Layers -->
            <aside id="panel-left" class="panel panel-left">
                <div class="panel-section">
                    <div class="panel-header">
                        <span class="panel-title">Hierarchy</span>
                    </div>
                    <div id="hierarchy-content" class="panel-content">
                        <div class="empty-state">Open a project to see entities</div>
                    </div>
                </div>
                <div class="panel-section">
                    <div class="panel-header">
                        <span class="panel-title">Layers</span>
                    </div>
                    <div id="layers-content" class="panel-content">
                        <div class="empty-state">No scene loaded</div>
                    </div>
                </div>
            </aside>

            <!-- Center: Viewport -->
            <main id="viewport-container" class="viewport-container">
                <div id="viewport" class="viewport">
                    <canvas id="game-canvas"></canvas>
                    <canvas id="gizmo-canvas"></canvas>
                </div>
                <div id="viewport-toolbar" class="viewport-toolbar">
                    <span id="viewport-info">No scene loaded</span>
                    <div class="zoom-controls">
                        <button id="zoom-out">−</button>
                        <span id="zoom-level">100%</span>
                        <button id="zoom-in">+</button>
                    </div>
                </div>
            </main>

            <!-- Right Panel: Inspector & Rig -->
            <aside id="panel-right" class="panel panel-right">
                <div class="panel-section">
                    <div class="panel-header">
                        <span class="panel-title">Inspector</span>
                    </div>
                    <div id="inspector-content" class="panel-content">
                        <div class="empty-state">Select an entity to inspect</div>
                    </div>
                </div>
                <div class="panel-section">
                    <div class="panel-header">
                        <span class="panel-title">Rig</span>
                    </div>
                    <div id="rig-content" class="panel-content">
                        <div class="empty-state">Select a rigged entity</div>
                    </div>
                </div>
            </aside>
        </div>

        <!-- Bottom Panel: Console & Assets -->
        <footer id="panel-bottom" class="panel panel-bottom">
            <div class="panel-tabs">
                <button class="tab-btn active" data-tab="assets">Assets</button>
                <button class="tab-btn" data-tab="tileset">Tileset</button>
                <button class="tab-btn" data-tab="console">Console</button>
                <button class="tab-btn" data-tab="animation">Animation</button>
            </div>
            <div id="tab-content" class="tab-content">
                <div id="assets-panel" class="tab-panel active">
                    <div class="asset-browser">
                        <div class="asset-folders" id="asset-folders">
                            <div class="empty-state">No project open</div>
                        </div>
                        <div class="asset-grid" id="asset-grid">
                        </div>
                    </div>
                </div>
                <div id="tileset-panel" class="tab-panel">
                    <div id="tileset-content">
                        <div class="tileset-empty">
                            <button id="btn-load-tileset" class="primary-btn">Load Tileset</button>
                            <div class="empty-state">No tileset loaded</div>
                        </div>
                    </div>
                </div>
                <div id="console-panel" class="tab-panel">
                    <div class="console-toolbar">
                        <button id="console-clear">Clear</button>
                        <select id="console-filter">
                            <option value="all">All</option>
                            <option value="info">Info</option>
                            <option value="warn">Warnings</option>
                            <option value="error">Errors</option>
                        </select>
                    </div>
                    <div id="console-output" class="console-output"></div>
                </div>
                <div id="animation-panel" class="tab-panel">
                    <div class="timeline-placeholder">
                        <div class="empty-state">Select a rigged entity to animate</div>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- Welcome Dialog -->
    <dialog id="welcome-dialog" class="dialog">
        <div class="dialog-content">
            <h2>Welcome to Triton</h2>
            <div class="dialog-buttons">
                <button id="btn-new-project" class="primary-btn">New Project</button>
                <button id="btn-open-project" class="secondary-btn">Open Project</button>
                <button id="btn-open-demo" class="secondary-btn">Open Demo</button>
            </div>
        </div>
    </dialog>

    <script type="module" src="app.js"></script>
</body>

</html>
